<main class="wrap">
  <h1>문의하기</h1>
  <p class="lead">내용 오류 제보, 사이트에 대한 의견, 제휴·광고 제안을 남겨 주세요. 확인한 뒤 적어 주신 이메일로 답변드립니다.</p>

  <section class="card" id="partner">
    <h2>문의·제휴 제안</h2>
    <form id="partner-form" data-clarity-mask="True" action="https://formspree.io/f/xgakrbkz" method="POST">
      <label class="f">문의 유형
        <select name="type" required>
          <option value="">선택해 주세요</option>
          <option>내용 오류·정정 제보</option>
          <option>사이트 이용 문의</option>
          <option>제휴·광고 제안</option>
          <option>개인정보 관련 요청</option>
          <option>기타</option>
        </select>
      </label>

      <label class="f">이름 또는 회사·브랜드명
        <input type="text" name="name" required placeholder="이름 또는 회사명">
      </label>

      <label class="f">이메일
        <input type="email" name="email" required placeholder="name@example.com">
      </label>

      <label class="f">연락처 <span class="opt">(선택)</span>
        <input type="tel" name="phone" placeholder="010-0000-0000">
      </label>

      <label class="f">문의 내용
        <textarea name="message" rows="6" required placeholder="내용을 자유롭게 적어 주세요."></textarea>
      </label>

      <label class="f" style="flex-direction:row;align-items:flex-start;gap:8px;font-weight:normal">
        <input type="checkbox" name="privacy_agree" value="동의" required style="margin-top:5px">
        <span><a href="./privacy" target="_blank">개인정보처리방침</a>에 따라 문의 응대를 위해 이름·이메일 등을 수집·이용하는 데 동의합니다.</span>
      </label>

      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

      <button type="submit" id="submit-btn" class="btn">문의 보내기</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
